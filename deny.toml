# cargo-deny: dependency policy enforced in CI (`cargo deny check`).
# Covers what cargo-audit does (RustSec advisories) plus licenses and sources.

[graph]
all-features = true

[advisories]
# RustSec advisory database; vulnerabilities and unmaintained crates fail CI.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses compatible with Apache-2.0 distribution.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # Boost 1.0 (OSI): xxhash-rust, a required dependency of the redis crate
  # (ADR 0011 R3). Permissive; no notice needed in binary distributions.
  "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
