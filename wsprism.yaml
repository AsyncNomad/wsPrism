# ==============================================================================
# wsPrism Gateway Configuration
# ==============================================================================
# This configuration controls the "Protection" and "Policy" layers of the gateway.
# It allows operators to define strict resource limits, DoS protection, and
# tenant-specific behaviors without recompiling the server.
# ==============================================================================

version: 1  # (required) Config schema version.

gateway:
  # ----------------------------------------------------------------------------
  # 1. Network & Lifecycle (Transport Layer)
  # ----------------------------------------------------------------------------

  # WebSocket server bind address (Host:Port).
  listen: "0.0.0.0:8080"

  # Internal listener — never expose it publicly. Serves the server API for
  # your backend (/api/v1/*, authenticated by tenants[].api_keys) and the
  # operational endpoints (/metrics, /healthz, /readyz). Bind it to loopback
  # or a private network. Omit to disable.
  api:
    listen: "127.0.0.1:8081"

  # Also serve /metrics on the public listener above. Off by default: metrics
  # name your tenants and reveal load.
  public_metrics: false

  # Server-side heartbeat interval (Ping).
  # The gateway sends PING frames to keep connections alive through load balancers.
  # type: integer (ms)
  ping_interval_ms: 20000

  # Idle timeout (Connection Liveness).
  # If no inbound activity (Pong/Text/Binary) is received within this window,
  # the gateway aggressively closes the session to free up resources.
  # type: integer (ms)
  idle_timeout_ms: 60000

  # Outbound Write Timeout (Slow Consumer Protection).
  # If a client cannot read data fast enough and the OS buffer fills up,
  # write operations will block. If blocking exceeds this time, the client is dropped.
  # type: integer (ms)
  writer_send_timeout_ms: 1500

  # Graceful Shutdown Period.
  # When SIGTERM is received, the gateway stops accepting new connections and
  # waits this long for existing sessions to disconnect cleanly.
  # type: integer (ms)
  drain_grace_ms: 5000

  # Per-session outbound queue capacity (messages).
  # When full, lossy publishes to that session are dropped, and a reply to the
  # session's own request closes it as a slow consumer (close 1008 "slow_consumer").
  # type: integer (1..=1048576), default 1024
  session_queue_capacity: 1024

  # Socket options for accepted connections.
  socket:
    # TCP_NODELAY (disable Nagle). Keep on for realtime traffic: with Nagle +
    # delayed ACKs, small frames can wait ~25-40 ms (see docs/BENCHMARKS.md).
    tcp_nodelay: true

  # Reverse proxies / load balancers whose X-Forwarded-For is trusted (IPs or CIDRs).
  # Behind an LB every TCP peer is the LB, so without this all clients share one
  # per-IP handshake bucket. Only the rightmost untrusted XFF hop is used, so
  # clients cannot spoof their address. Empty = trust none (default).
  trusted_proxies: []
  # trusted_proxies: ["10.0.0.0/8", "192.168.0.10"]


  # ----------------------------------------------------------------------------
  # 2. Handshake Defender (DoS Protection)
  # ----------------------------------------------------------------------------
  # Protects the server from "Connection Storms" and DoS attacks.
  # Checks are performed at the HTTP layer *before* WebSocket upgrade logic runs.
  # Rejected clients receive HTTP 429 Too Many Requests with a `Retry-After` header.
  
  handshake_limit:
    # Master switch for the defender (on by default; turn off only for load
    # tests from a single address).
    enabled: true

    # Global Limit (Token Bucket):
    # Total connection attempts allowed per second across ALL IPs.
    # Protects the server from total CPU exhaustion.
    global_rps: 500
    global_burst: 1000

    # Per-IP Limit (Token Bucket):
    # Connection attempts allowed per specific IP address.
    # Prevents a single actor from flooding the handshake endpoint.
    per_ip_rps: 10
    per_ip_burst: 20

    # IPv6 clients count per prefix of this length (a subscriber usually holds
    # a whole /64, so per-address limits would be trivial to sidestep). 32-128.
    ipv6_prefix_len: 64

    # Memory Safety:
    # Max number of unique IP addresses to track in memory. At the cap, entries
    # whose bucket has fully refilled are evicted; addresses that still don't
    # fit are limited by the global bucket only.
    max_ip_entries: 50000


tenants:
  # ============================================================================
  # Tenant A: "starter_plan" (Strict Resource Governance)
  # ============================================================================
  # Example for a free-tier or shared environment where isolation is critical.
  # ============================================================================
  - id: starter_plan

    limits:
      # Packet Size Limit.
      max_frame_bytes: 4096

      # [NEW in Sprint 5] Resource Governance Limits
      # ------------------------------------------------------------
      
      # 1. Tenant-wide Concurrency Cap.
      # If exceeded, new connections are rejected at HTTP layer (503 Service Unavailable).
      # 0 = Unlimited.
      max_sessions_total: 1000 

      # 2. Total Room Cap.
      # Prevents "Room Spamming" (creating thousands of 1-person rooms).
      max_rooms_total: 500

      # 3. Room Density Limit.
      # Max users allowed in a single room.
      max_users_per_room: 50

      # 4. User Complexity Limit.
      # Max unique rooms a single user can join simultaneously.
      max_rooms_per_user: 5

    policy:
      # Rate Limiting (Post-Handshake traffic control)
      rate_limit_rps: 50
      rate_limit_burst: 100
      rate_limit_scope: connection  # Applied per socket

      # Session Policy
      sessions:
        mode: single                # Only 1 session allowed per user
        max_sessions_per_user: 1
        on_exceed: kick_oldest      # Login elsewhere kicks the previous session

      # Security
      ext_allowlist:
        - "room:join"
        - "room:leave"
        - "chat:send"
      
      hot_allowlist: []             # Binary protocol disabled for this tenant

      # Browser origins allowed to connect (cross-site WebSocket hijacking protection).
      # Requests without an Origin header (native apps, servers) are always allowed.
      # Empty = deny every browser origin. Patterns: exact, "https://*.domain", or "*".
      allowed_origins:
        - "https://app.example.com"

      # Where clients may present their ticket, in priority order (default: header, subprotocol).
      #   header      -> Authorization: Bearer <ticket>
      #   subprotocol -> Sec-WebSocket-Protocol: wsprism.v1, wsprism.auth.<ticket>  (browsers)
      #   query       -> ?ticket=<ticket>  (legacy; leaks into access logs, so off by default)
      ticket_sources: [header, subprotocol]


  # ============================================================================
  # Tenant B: "enterprise_game" (High Performance)
  # ============================================================================
  # Example for a multiplayer game requiring low latency and high concurrency.
  # ============================================================================
  - id: enterprise_game

    limits:
      max_frame_bytes: 65536

      # Relaxed Resource Limits
      max_sessions_total: 100000    # Supports massive scale
      max_rooms_total: 10000
      max_users_per_room: 200       # Large matches/lobbies
      max_rooms_per_user: 0         # Unlimited room joins (e.g., global chat + guild + match)

    # Game logic lives in your own backend (any language): `match:*` requests
    # are forwarded to it over HTTP and its answers come back as sys.reply
    # (RPC proxy, docs/CONFIG.md). Every allowlisted service must exist:
    # built-in, registered with GatewayBuilder, or routed here. Until a
    # backend listens on this URL, match requests are answered UNAVAILABLE.
    rpc:
      url: "http://127.0.0.1:9000/wsprism/rpc"
      allow: ["match:*"]

    policy:
      rate_limit_rps: 2000
      rate_limit_burst: 4000
      rate_limit_scope: connection

      sessions:
        mode: multi                 # Allow PC and Mobile at the same time
        max_sessions_per_user: 4
        on_exceed: deny             # Prevent 5th connection

      # Hot Lane (Binary) Configuration
      # Used for movement/physics data.
      # 'silent' mode drops invalid packets without sending error frames (saves bandwidth).
      hot_error_mode: silent
      hot_requires_active_room: true

      # Routing Whitelist
      ext_allowlist:
        - "room:*"
        - "match:*"
        - "chat:*"
      
      # Binary OpCodes (Service ID : OpCode)
      hot_allowlist:
        - "1:*"     # Service 1: the built-in room relay (positions etc.), all opcodes
        # - "2:10"  # Your own Hot service 2, opcode 10 only — register it first
        #           # with GatewayBuilder::hot_service (docs/API.md); an allowlist
        #           # entry for an unregistered service fails startup


  # ============================================================================
  # Tenant C: "internal_dashboard" (Monitoring Tool)
  # ============================================================================
  - id: internal_sys

    limits:
      max_frame_bytes: 1048576      # Allow large JSON payloads (1MB)
      max_sessions_total: 50
      max_rooms_total: 0
      max_users_per_room: 0
      max_rooms_per_user: 0

    policy:
      rate_limit_rps: 500
      rate_limit_burst: 1000
      rate_limit_scope: tenant      # Shared pool for all dashboard users

      sessions:
        mode: multi
        max_sessions_per_user: 10
        on_exceed: kick_oldest

      ext_allowlist:
        - "room:*"                  # Dashboards join rooms and receive server publishes
      # Gateway metrics are not a WebSocket service: scrape GET /metrics on the
      # internal listener (gateway.api.listen).
