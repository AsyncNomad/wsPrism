name: Docs

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook + mermaid
        run: cargo install mdbook mdbook-mermaid --locked

      # One book per language from docs/book/<lang>: English at /, Korean
      # at /ko/, Chinese at /zh/. lang-switch.js links between them.
      - name: Build the books
        run: |
          for lang in en ko zh; do
            mdbook-mermaid install docs/book/$lang
            mdbook build docs/book/$lang
          done
          mkdir -p public
          cp -r docs/book/en/book/* public/
          cp -r docs/book/ko/book public/ko
          cp -r docs/book/zh/book public/zh

      - name: Build Rust docs (at /api/)
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features --locked
          cp -r target/doc public/api

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
