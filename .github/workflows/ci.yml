name: CI

on:
  push:
    branches: [ main, dev, hardening ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # JS SDK against a real gateway process (sdk/js/run-tests.sh).
  # Node: every non-EOL LTS line the SDK supports (engines: >=22).
  sdk-js:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: SDK tests
        run: sdk/js/run-tests.sh
      - name: SDK type declarations
        run: npx --yes -p typescript@5 tsc -p sdk/js

  # Dependency policy: RustSec advisories (what cargo-audit checks), licenses,
  # sources and bans, as configured in deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Short fuzzing smoke run per parser that sees untrusted input (fuzz/).
  # Longer campaigns run locally: cargo +nightly fuzz run <target>.
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [hot_frame, envelope, client_ip, origin, subprotocol]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Fuzz ${{ matrix.target }} (60s)
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60
