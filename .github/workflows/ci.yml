name: CI

on:
  push:
    # Working branches too (v/*): a job must have run once before a merge
    # (the fuzz job first ran on GitHub at the merge of v/validation).
    branches: [ main, dev, hardening, 'v/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Libraries alone: dev-dependency features (`internals`) unify into the
      # all-targets build above and can hide dead code.
      - name: Clippy (libraries only)
        run: cargo clippy --workspace --lib --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # The gateway suite again, room traffic through a queued loopback
      # broker (ADR 0011 B3): queued mode must behave like one node.
      - name: Test (queued broker)
        run: cargo test -p wsprism-gateway --locked
        env:
          WSPRISM_TEST_BROKER: queued

  # Two gateway nodes sharing rooms through a Redis container
  # (ADR 0011 R3). The service is only reachable from this job.
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # For every step: without it the Rust cluster tests skip themselves
    # (and pass), which they silently did here before.
    env:
      WSPRISM_TEST_REDIS: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A named container (not a service): the chaos tests restart, pause and
      # snapshot it by name (WSPRISM_TEST_REDIS_CONTAINER, default wsp-redis).
      - name: Redis
        run: docker run -d --name wsp-redis -p 6379:6379 redis:7.2 redis-server --save "" --appendonly no
      - name: Cluster tests
        run: |
          cargo test -p wsprism-gateway --locked --test cluster --test cluster_gap --test history
          cargo test -p wsprism-redis --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Every scenario: node kill, rolling update, a node frozen past its
      # slot TTL (fencing), Redis restart (empty and from an older snapshot),
      # Redis pause, stop while Redis is slow.
      - name: Chaos tests
        run: |
          cargo build -p wsprism-gateway --locked
          node --test --test-force-exit sdk/js/test/chaos.test.mjs

  # The container image builds (Dockerfile, deploy/compose).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t wsprism-gateway:ci .
      - name: The binary runs in it
        run: docker run --rm --network none wsprism-gateway:ci --version

  # Minimum supported Rust version (workspace rust-version; ADR 0009 §5-4).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: Check on the MSRV
        run: cargo check --workspace --all-targets --locked

  # JS SDK against a real gateway process (sdk/js/run-tests.sh).
  # Node: every non-EOL LTS line the SDK supports (engines: >=22).
  sdk-js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: SDK tests
        run: sdk/js/run-tests.sh
      - name: Example app (end to end)
        run: examples/chat-and-state/run-tests.sh
      - name: SDK type declarations
        run: npx --yes -p typescript@5 tsc -p sdk/js

  # Dependency policy: RustSec advisories (what cargo-audit checks), licenses,
  # sources and bans, as configured in deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Short fuzzing smoke run per parser that sees untrusted input (fuzz/).
  # Longer campaigns run locally: cargo +nightly fuzz run <target>.
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [hot_frame, envelope, client_ip, origin, subprotocol]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # The prebuilt cargo-fuzz is a musl binary and defaults to its own
      # target (x86_64-unknown-linux-musl), which AddressSanitizer does not
      # support: name the target. Build and run are separate steps, so a
      # build problem is not mistaken for a finding.
      - name: Build ${{ matrix.target }}
        working-directory: fuzz
        run: cargo fuzz build --target x86_64-unknown-linux-gnu ${{ matrix.target }}
      - name: Fuzz ${{ matrix.target }} (60s)
        working-directory: fuzz
        run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=60
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
