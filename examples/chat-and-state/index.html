<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wsPrism lobby</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 0; padding: 16px; max-width: 760px; margin-inline: auto; }
  #field { position: relative; height: 260px; border: 1px solid #999; border-radius: 6px; background: #f6f6f6; touch-action: none; }
  .dot { position: absolute; width: 14px; height: 14px; margin: -7px; border-radius: 50%; }
  .dot span { position: absolute; left: 16px; top: -3px; font-size: 12px; white-space: nowrap; }
  #log { height: 180px; overflow: auto; border: 1px solid #ccc; border-radius: 6px; padding: 6px; margin: 8px 0; }
  form { display: flex; gap: 6px; } input { flex: 1; } .muted { color: #777; }
</style>
</head>
<body>
<h1>wsPrism lobby</h1>
<form id="login"><input id="name" placeholder="your name" autocomplete="off" required><button>Join</button></form>
<div id="app" hidden>
  <p class="muted">Move the mouse over the field: positions go over the Hot lane (latest value wins). Chat and dice go over the Ext lane.</p>
  <div id="field"></div>
  <div id="log"></div>
  <form id="chat"><input id="msg" placeholder="say something" autocomplete="off"><button>Send</button><button type="button" id="roll">Roll a die</button></form>
</div>
<script type="module">
import { WsPrismClient } from "/wsprism.js";

const $ = (id) => document.getElementById(id);
const log = (text, cls = "") => {
  const p = document.createElement("div");
  p.textContent = text;
  p.className = cls;
  $("log").append(p);
  $("log").scrollTop = 1e9;
};
const dots = new Map(); // sender member id -> element
const colors = ["#e4572e", "#29335c", "#f3a712", "#669bbc", "#2a9d8f", "#8338ec"];

$("login").onsubmit = async (e) => {
  e.preventDefault();
  const name = $("name").value.trim();
  const client = new WsPrismClient({
    url: `ws://${location.hostname}:8080/v1/ws`,
    tenant: "demo",
    // A fresh one-time ticket for every (re)connection.
    getTicket: async () => {
      const r = await fetch("/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name }) });
      if (!r.ok) throw new Error((await r.json()).error);
      return (await r.json()).ticket;
    },
  });
  client.on("message", (m) => {
    if (m.svc === "chat") log(`${m.data.from}: ${m.data.msg}`);
    else if (m.svc === "server" && m.data?.event === "roll") log(`🎲 ${m.data.by} rolled ${m.data.value}`, "muted");
  });
  client.on("state", (s) => {
    if (s.payload.length < 4) return;
    const v = new DataView(s.payload.buffer, s.payload.byteOffset);
    let d = dots.get(s.sender);
    if (!d) {
      d = document.createElement("div");
      d.className = "dot";
      d.style.background = colors[s.sender % colors.length];
      d.innerHTML = `<span>${s.sender}</span>`;
      $("field").append(d);
      dots.set(s.sender, d);
    }
    d.style.left = `${v.getUint16(0, true) / 10}%`;
    d.style.top = `${v.getUint16(2, true) / 10}%`;
  });
  // Presence (presence_events): drop a member's cursor when it leaves.
  client.on("presence", (p) => {
    log(`${p.user} ${p.type === "joined" ? "joined" : "left"}`, "muted");
    if (p.type === "left") {
      dots.get(p.memberId)?.remove();
      dots.delete(p.memberId);
    }
  });
  client.on("close", (c) => log(`disconnected (${c.code})${c.willReconnect ? ", reconnecting..." : ""}`, "muted"));
  client.on("error", (err) => log(`error: ${err.code} ${err.message}`, "muted"));

  await client.connect();
  const me = await client.join("lobby");
  $("login").hidden = true;
  $("app").hidden = false;
  log(`joined as ${name} (member ${me.memberId}); here: ${me.members.map((m) => m.user).join(", ") || "nobody"}`, "muted");

  $("chat").onsubmit = (e) => {
    e.preventDefault();
    if (!$("msg").value) return;
    client.send("chat", "send", { room: "lobby", data: { msg: $("msg").value } });
    $("msg").value = "";
  };
  $("roll").onclick = () => client.rpc("game", "roll", { room: "lobby" }).catch((err) => log(`roll failed: ${err.code}`, "muted"));
  $("field").onpointermove = (e) => {
    const r = $("field").getBoundingClientRect();
    const buf = new Uint8Array(4);
    const v = new DataView(buf.buffer);
    v.setUint16(0, Math.round(((e.clientX - r.left) / r.width) * 1000), true); // 0..1000 = 0..100%
    v.setUint16(2, Math.round(((e.clientY - r.top) / r.height) * 1000), true);
    client.sendState("lobby", { svc: 1, op: 1, key: 0, payload: buf });
  };
};
</script>
</body>
</html>
