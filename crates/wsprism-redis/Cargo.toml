[package]
name = "wsprism-redis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "wsPrism cluster broker on Redis: room fan-out between gateway nodes (experimental)"
readme = "README.md"
keywords = ["websocket", "realtime", "redis", "pubsub"]
categories = ["network-programming", "asynchronous"]

[dependencies]
wsprism-engine = { workspace = true }
redis = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
# The crypto provider for `rediss://` (the redis crate's rustls has none of
# its own; without one, the first TLS connection panics).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
