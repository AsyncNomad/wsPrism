[package]
name = "wsprism-gateway"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true

[dependencies]
wsprism-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_norway = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bytes = { workspace = true }

axum = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }

dashmap = { workspace = true }
async-trait = { workspace = true }
ipnet = { workspace = true }
clap = { workspace = true, features = ["env"] }
# Must match the tungstenite version axum's `ws` feature uses: we downcast
# axum::Error to tungstenite::Error to detect oversize frames (S2). The S2
# integration tests fail if the versions drift apart.
tungstenite = "0.24"

[dev-dependencies]
criterion = { workspace = true }
tokio-tungstenite = "0.24"

[[bench]]
name = "hotpath"
harness = false
