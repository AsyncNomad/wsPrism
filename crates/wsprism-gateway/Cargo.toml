[package]
name = "wsprism-gateway"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true

[dependencies]
wsprism-protocol = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_norway = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bytes = { workspace = true }

axum = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }

dashmap = { workspace = true }
async-trait = { workspace = true }
ipnet = { workspace = true }
clap = { workspace = true, features = ["env"] }
# Must match the tungstenite version axum's `ws` feature uses: we downcast
# axum::Error to tungstenite::Error to detect oversize frames (S2). The S2
# integration tests fail if the versions drift apart.
tungstenite = "0.24"
mimalloc = { version = "0.1.52", optional = true }
ring = "0.17"
base64 = "0.22"
jsonwebtoken = { version = "9.3", default-features = false, features = ["use_pem"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2"] }

[dev-dependencies]
criterion = { workspace = true }
ring = "0.17"
tokio-tungstenite = "0.24"

[[bench]]
name = "hotpath"
harness = false

[features]
mimalloc = ["dep:mimalloc"]
