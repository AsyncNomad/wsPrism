[package]
name = "wsprism"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-tenant realtime gateway: build a WebSocket gateway with your own services and authenticators"
readme = "README.md"
keywords = ["websocket", "gateway", "realtime", "multi-tenant", "gamedev"]
categories = ["network-programming", "web-programming::websocket", "asynchronous", "game-development"]

[dependencies]
wsprism-protocol = { workspace = true }
wsprism-engine = { workspace = true }
wsprism-gateway = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["redis"]
# Cluster broker on Redis (`gateway.broker.kind: redis`, ADR 0011). Without
# it the gateway has no Redis dependency and a redis broker config is an
# error at startup.
redis = ["wsprism-gateway/redis"]

[dev-dependencies]
tokio = { workspace = true }
tokio-tungstenite = "0.24"
futures-util = { workspace = true }
