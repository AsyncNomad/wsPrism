[package]
name = "wsprism-loadgen"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
publish = false
description = "Load generator measuring wsPrism end-to-end latency and throughput"

[dependencies]
tokio = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
hdrhistogram = { workspace = true }
clap = { workspace = true }
tokio-tungstenite = "0.24"
# statesync: WSS and WebTransport clients (benchmark only; certs not verified)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
wtransport = { version = "0.7", features = ["dangerous-configuration"] }
# gateway --target pusher: private-channel auth signatures (HMAC-SHA256)
ring = "0.17"
