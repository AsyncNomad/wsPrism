# Two wsPrism nodes sharing rooms through Redis (docs/CLUSTER.md).
#
#   export DEMO_API_KEY=$(openssl rand -hex 24)
#   export DEMO_API_KEY_SHA256=$(printf %s "$DEMO_API_KEY" | sha256sum | cut -d' ' -f1)
#   docker compose -f deploy/compose/compose.yaml up --build
#
# Clients: ws://localhost:8080/v1/ws and ws://localhost:8090/v1/ws (give the
# JS SDK both: url: [..]). Backend: http://localhost:8081 or :8091 with
# `Authorization: Bearer $DEMO_API_KEY`. Rolling update: restart one node
# at a time (docker compose restart node1, then node2).
#
# This is a starting point, not a hardened deployment: no TLS (put a TLS
# terminating proxy or load balancer in front), Redis without a password or
# persistence (add an ACL user, docs/CONFIG.md), API ports published on the
# host for the demo only.

x-node: &node
  build: ../..
  image: wsprism-gateway:local
  environment:
    REDIS_URL: redis://redis:6379
    DEMO_API_KEY_SHA256: ${DEMO_API_KEY_SHA256:?set DEMO_API_KEY_SHA256 (see the top of this file)}
    DEMO_ORIGIN: ${DEMO_ORIGIN:-http://localhost:3000}
    RUST_LOG: ${RUST_LOG:-info}
  volumes:
    - ./wsprism.yaml:/etc/wsprism/wsprism.yaml:ro
  depends_on: [redis]
  restart: unless-stopped
  # Longer than drain_grace_ms in wsprism.yaml.
  stop_grace_period: 10s
  networks: [backend]

services:
  redis:
    image: redis:7.2
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    networks: [backend]

  node1:
    <<: *node
    ports: ["8080:8080", "127.0.0.1:8081:8081"]

  node2:
    <<: *node
    ports: ["8090:8080", "127.0.0.1:8091:8081"]

networks:
  backend: {}
